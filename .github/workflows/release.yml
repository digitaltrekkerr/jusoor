name: Release

"on":
  push:
    branches:
      - main
    # Semver tags (v0.1.7, v1.0.0, …) publish a non-prerelease GitHub
    # Release that the in-app update checker treats as the latest version.
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - run: dart pub global activate melos ^7.0.0

      - run: melos bootstrap

      - name: Decode signing material
        env:
          JUSOOR_RELEASE_JKS_BASE64: ${{ secrets.JUSOOR_RELEASE_JKS_BASE64 }}
          JUSOOR_KEY_PROPERTIES: ${{ secrets.JUSOOR_KEY_PROPERTIES }}
        run: |
          if [ -z "${JUSOOR_RELEASE_JKS_BASE64:-}" ] || [ -z "${JUSOOR_KEY_PROPERTIES:-}" ]; then
            echo "::error::Missing one of the required secrets on the 'release' environment."
            exit 1
          fi
          printf '%s' "$JUSOOR_RELEASE_JKS_BASE64" | base64 -d > "$HOME/jusoor-release-key.jks"
          # Replace any local storeFile path in key.properties with the
          # runner-side decoded location: local machines keep the JKS under
          # their own $HOME; the CI runner uses /home/runner — same JKS,
          # different $HOME.
          printf '%s' "$JUSOOR_KEY_PROPERTIES" \
            | sed -E "s|^storeFile=.*|storeFile=$HOME/jusoor-release-key.jks|" \
            > translation_app/android/key.properties
          ls -la "$HOME/jusoor-release-key.jks"

      - name: Build signed release APK
        working-directory: translation_app
        run: |
          LOG="$RUNNER_TEMP/release-build.log"
          flutter build apk --release --split-per-abi 2>&1 | tee "$LOG"

      - name: Fail-closed guard (reject debug-signed APKs)
        if: always()
        run: |
          LOG="$RUNNER_TEMP/release-build.log"
          if [ ! -f "$LOG" ]; then
            echo "::error::Build log not found at $LOG"
            exit 1
          fi
          if grep -q "DEBUG keystore" "$LOG" || \
             grep -q "falling back to DEBUG signing config" "$LOG"; then
            echo "::error::Release APK was signed with the DEBUG keystore. Refusing to publish."
            exit 1
          fi

      - name: Rename APKs to jusoor-<abi>.apk
        run: |
          set -euo pipefail
          SRC_DIR="translation_app/build/app/outputs/flutter-apk"
          declare -A APKS=(
            ["app-armeabi-v7a-release.apk"]="jusoor-armeabi-v7a.apk"
            ["app-arm64-v8a-release.apk"]="jusoor-arm64-v8a.apk"
            ["app-x86_64-release.apk"]="jusoor-x86_64.apk"
          )
          for SRC_NAME in "${!APKS[@]}"; do
            DST_NAME="${APKS[$SRC_NAME]}"
            SRC="$SRC_DIR/$SRC_NAME"
            if [ ! -f "$SRC" ]; then
              echo "::error::Expected APK not found at $SRC"
              exit 1
            fi
            mv "$SRC" "$DST_NAME"
          done
          ls -la jusoor-*.apk

      - name: Publish public GitHub Release 'jusoor' with jusoor-<abi>.apk
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          # Semver tag pushes become the 'latest' release; main-push builds
          # stay as prerelease CI artifacts so releases/latest always points
          # at a real semver release for the update checker.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.sha) }}
          name: jusoor
          body: ${{ github.event.head_commit.message }}
          files: |
            jusoor-armeabi-v7a.apk
            jusoor-arm64-v8a.apk
            jusoor-x86_64.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
